version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: bd_rape
    environment:
      POSTGRES_DB: bd-rape
      POSTGRES_USER: rape
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: